<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eaty - Food Delivery India | Order Biryani, Pizza & Dosas Online</title>
  <meta name="description" content="Eaty is India's modern food ordering & delivery app with real-time GPS geolocation, nearest restaurant discovery, authentic cuisines, live order tracking, and UPI & COD payments." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/restaurant.css" />
  <link rel="stylesheet" href="css/cart-checkout.css" />
  <link rel="stylesheet" href="css/tracking.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Favicon / App Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%236366f1%22/><text x=%2250%22 y=%2268%22 font-family=%22sans-serif%22 font-size=%2256%22 font-weight=%22900%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>E</text></svg>" />
</head>
<body>

  <!-- Main Top Header -->
  <header class="main-header">
    <div class="app-container header-inner">
      <!-- Brand Logo -->
      <div class="brand-section" onclick="window.appRouter.navigate('home')">
        <div class="brand-logo-badge">E</div>
        <div class="brand-text-block">
          <span class="brand-name">eaty</span>
          <span class="brand-tagline">FOOD &amp; MORE</span>
        </div>
      </div>

      <!-- Deliver-To Location Pill -->
      <div class="deliver-to-selector" id="deliver-to-selector" title="Change delivery location">
        <span class="location-icon-pin">📍</span>
        <div class="deliver-info">
          <span class="deliver-label" id="header-location-label">DELIVERING TO</span>
          <span class="deliver-address" id="header-location-address">Koramangala 5th Block, Bengaluru</span>
        </div>
        <span class="chevron-down">▼</span>
      </div>

      <!-- Header Action Buttons -->
      <div class="header-actions">
        <!-- Switch to Partner Portal -->
        <button class="header-btn partner-btn desktop-only" onclick="window.appRouter.navigate('admin')">
          <span>👨‍🍳</span>
          <span>Partner Portal</span>
        </button>

        <!-- Login Portal Button -->
        <button class="header-btn desktop-only" id="header-login-btn" onclick="window.appRouter.navigate('login')" title="Customer & Partner Login Portal">
          <span>🔐</span>
          <span id="header-login-btn-text">Sign In</span>
        </button>

        <!-- User Profile Button -->
        <button class="header-btn desktop-only" onclick="window.appRouter.navigate('profile')">
          <span>👤</span>
          <span>Account</span>
        </button>

        <!-- Theme Palette Switcher -->
        <div class="theme-dropdown-wrap" id="theme-dropdown-wrap">
          <button class="header-btn theme-toggle-btn" id="theme-toggle-btn" onclick="window.UI.toggleThemeDropdown(event)" title="Choose Color Theme & Mode">
            <span class="theme-swatch-dot" id="theme-swatch-dot"></span>
            <span class="desktop-only">Theme</span>
          </button>
          <div class="theme-menu-popover" id="theme-menu-popover" style="display: none;">
            <div class="theme-menu-header">
              <span class="theme-menu-heading">Color Themes</span>
              <button class="theme-dark-btn" id="theme-dark-toggle-btn" onclick="window.UI.toggleDarkMode(event)" title="Toggle Dark Mode">
                <span id="dark-mode-icon">🌙</span>
                <span id="dark-mode-label">Dark</span>
              </button>
            </div>
            <div class="theme-palette-list">
              <button class="theme-palette-item active" data-color="indigo" onclick="window.UI.setTheme('indigo')">
                <span class="theme-swatch-circle" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);"></span>
                <span class="theme-palette-name">Electric Indigo</span>
                <span class="theme-check-icon">✓</span>
              </button>
              <button class="theme-palette-item" data-color="emerald" onclick="window.UI.setTheme('emerald')">
                <span class="theme-swatch-circle" style="background: linear-gradient(135deg, #059669, #10b981);"></span>
                <span class="theme-palette-name">Emerald Mint</span>
                <span class="theme-check-icon">✓</span>
              </button>
              <button class="theme-palette-item" data-color="ruby" onclick="window.UI.setTheme('ruby')">
                <span class="theme-swatch-circle" style="background: linear-gradient(135deg, #e11d48, #fb7185);"></span>
                <span class="theme-palette-name">Crimson Ruby</span>
                <span class="theme-check-icon">✓</span>
              </button>
              <button class="theme-palette-item" data-color="orange" onclick="window.UI.setTheme('orange')">
                <span class="theme-swatch-circle" style="background: linear-gradient(135deg, #ff5200, #ff782d);"></span>
                <span class="theme-palette-name">Sunset Orange</span>
                <span class="theme-check-icon">✓</span>
              </button>
              <button class="theme-palette-item" data-color="cyan" onclick="window.UI.setTheme('cyan')">
                <span class="theme-swatch-circle" style="background: linear-gradient(135deg, #0284c7, #06b6d4);"></span>
                <span class="theme-palette-name">Cyber Cyan</span>
                <span class="theme-check-icon">✓</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Cart Button -->
        <button class="header-cart-btn" onclick="window.appRouter.navigate('cart')">
          <span>🛒</span>
          <span class="desktop-only">Cart</span>
          <span class="cart-counter-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-container" id="main-content-view">
    <!-- Rendered dynamically by Router -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-item active" data-view="home" onclick="window.appRouter.navigate('home')">
      <span class="bottom-nav-icon">🍽️</span>
      <span>Restaurants</span>
    </button>
    <button class="bottom-nav-item" data-view="cart" onclick="window.appRouter.navigate('cart')">
      <span class="bottom-nav-icon">🛒</span>
      <span>Cart</span>
      <span class="bottom-cart-badge" style="display: none;">0</span>
    </button>
    <button class="bottom-nav-item" data-view="tracking" onclick="window.appRouter.navigate('tracking')">
      <span class="bottom-nav-icon">🛵</span>
      <span>Track</span>
    </button>
    <button class="bottom-nav-item" data-view="admin" onclick="window.appRouter.navigate('admin')">
      <span class="bottom-nav-icon">👨‍🍳</span>
      <span>Partner</span>
    </button>
    <button class="bottom-nav-item" data-view="login" onclick="window.appRouter.navigate('login')">
      <span class="bottom-nav-icon">🔐</span>
      <span>Login</span>
    </button>
  </nav>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="js/sound.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/login.js"></script>
  <script src="js/app.js"></script>

  <!-- App Router & Initialization -->
  <script>
    class AppRouter {
      constructor() {
        this.routes = {
          '': 'home',
          'home': 'home',
          'restaurant': 'restaurant',
          'cart': 'cart',
          'checkout': 'checkout',
          'tracking': 'tracking',
          'profile': 'profile',
          'admin': 'admin',
          'login': 'login',
        };

        window.addEventListener('hashchange', () => this.handleHashChange());
      }

      init() {
        if (!window.location.hash) {
          window.location.hash = '#/';
        } else {
          this.handleHashChange();
        }
      }

      navigate(viewName, params = {}) {
        if (params.restaurantId) {
          window.eatyState.set('activeRestaurantId', params.restaurantId);
        }
        window.location.hash = `#/${viewName}`;
      }

      handleHashChange() {
        const hash = window.location.hash.replace('#/', '').split('?')[0];
        const view = this.routes[hash] || 'home';
        window.eatyState.set('currentView', view);
        window.App.renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    window.appRouter = new AppRouter();

    // Bootstrap app once DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      window.UI.initTheme();
      window.App.init();
      window.appRouter.init();
    });
  </script>
</body>
</html>
